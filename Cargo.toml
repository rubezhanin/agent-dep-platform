[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/hermes-adapter",
    "crates/cli",
    "crates/server",
    "crates/tauri-app",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
authors = ["Agent Deployment Platform Contributors"]
repository = ""  # private local-only; intentionally empty

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# 2.11.0 (B8, audit): `serde_yaml`
# 0.9.34 is `+deprecated` per
# `cargo audit` — the official
# crate has been unmaintained
# since 2024-03 (no commits,
# open unsoundness issues).
# `serde_yaml_ng` is the
# community-maintained active
# fork (compatible API,
# same semver namespace as
# `serde_yaml`).
thiserror = "1"
anyhow = "1"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
ts-rs = "11"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
proptest = "1"
clap = { version = "4", features = ["derive"] }
which = "6"
tempfile = "3"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
# 2.11.0 (P1-AUD-02, CWE-345): HMAC-SHA-256
# for the audit-log hash chain. The `reset`
# feature is needed by the streaming API
# (unused in our static-key use case but
# the default features are fine).
hmac = "0.12"
hex = "0.4"
walkdir = "2"
dunce = "1"
semver = "1"
# 2.11.0 (B5, audit): per-key
# sharded, lock-free rate-limit
# buckets. Replaces the
# `Mutex<HashMap>` in
# `crates/server/src/rate_limit.rs`
# (the global Mutex was a
# contention bottleneck at 100
# RPS × N routes).
dashmap = "6"
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace"] }
rand = "0.8"
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
# 2.7.7.1 (ES256/ES384): ECDSA P-256
# and P-384 public keys for JWS
# signature verification. The `ecdsa`
# feature pulls in `ecdsa` + `sha2`
# for `VerifyingKey<Sha*>::verify`.
p256 = { version = "0.13", features = ["ecdsa", "sha2"] }
p384 = { version = "0.13", features = ["ecdsa", "sha2"] }
# `signature` is the trait crate that
# `rsa` / `p256` / `p384` use to expose
# `Verifier` + `Signer`. Pulled in
# explicitly so the server crate can
# `use signature::Verifier;` once and
# reach all three back-ends.
signature = { version = "2", features = ["std"] }
# 2.7.4 (ADR-0032): Ed25519 plugin
# manifest signing. The `rand_core`
# feature lets the trust-store tests
# generate ephemeral key pairs
# without a heavy `getrandom` setup.
ed25519-dalek = { version = "2", features = ["rand_core"] }
git2 = { version = "0.20", features = ["vendored-libgit2"] }
# 3.0.0 (C4, audit): Prometheus
# exposition format for the
# `/v1/metrics` endpoint. The
# `prometheus` crate is the
# canonical encoder — it gives
# us `IntCounter`, `IntCounterVec`,
# and `TextEncoder` for the
# `text/plain; version=0.0.4`
# rendering without pulling
# the heavier
# `metrics-exporter-prometheus`
# or `axum-prometheus` adapter
# crates.
prometheus = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
