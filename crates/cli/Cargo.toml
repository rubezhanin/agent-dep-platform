[package]
name = "agent_dep_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "agent_dep_cli"
path = "src/lib.rs"

[[bin]]
name = "agency"
path = "src/main.rs"

[dependencies]
agent_dep_core = { path = "../core" }
agent_dep_hermes_adapter = { path = "../hermes-adapter" }
clap = { workspace = true }
clap_complete = "4"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
semver = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
# 2.10.0 (D1, audit): the
# `agency health` subcommand
# probes a running
# `agency-server` via
# `GET /v1/health`. Pre-fix
# the docker-compose healthcheck
# used
# `["agency-server", "--help"]`
# which always exits 0 (a
# crashed server still
# reported healthy).
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
