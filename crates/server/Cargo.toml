[package]
name = "agent_dep_server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agency-server"
path = "src/main.rs"

[dependencies]
agent_dep_core = { path = "../core" }
agent_dep_hermes_adapter = { path = "../hermes-adapter" }
agent_dep_cli = { path = "../cli" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
# 2.7.7 (ADR-0035): OIDC real
# wire-protocol client. `reqwest` was
# previously a dev-dependency; promoted
# to dependencies here so the OIDC
# client (and any future HTTP server
# endpoint) can use it. The full
# RSA / ECDSA signature verification is
# deferred to 2.7.7.1; 2.7.7 ships the
# transport + claims validation.
# `async_trait` makes `OidcClient`
# object-safe so we can store it as
# `Arc<dyn OidcClient>` in `ServerState`.
reqwest = { workspace = true }
async-trait = { workspace = true }
# 2.7.9 (ADR-0037): full RSA
# signature verification of the
# OIDC id_token. `rsa` 0.9 + the
# `sha2` feature for
# `pkcs1v15::SigningKey<Sha*>`.
rsa = { workspace = true }
# 2.7.7.1: ES256/ES384 (ECDSA P-256
# / P-384) + PS256/PS384/PS512
# (RSA-PSS) signature verification.
# The ES algorithms need `p256` and
# `p384`; PS algorithms use `rsa`'s
# `pss` module + `sha2`.
p256 = { workspace = true }
p384 = { workspace = true }
signature = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
